name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686 zip
      - name: Build
        run: make dist VERSION=${GITHUB_REF_NAME//\//-}
      - uses: actions/upload-artifact@v4
        with:
          name: PitfallFix
          path: build/PitfallFix-*.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/PitfallFix-*.zip
