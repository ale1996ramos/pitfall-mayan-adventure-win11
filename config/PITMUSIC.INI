; PITMUSIC.INI - virtual CD for Pitfall: The Mayan Adventure (PITMM.DLL)
; Maps each track of the original game CD to an audio file.
; Paths are relative to the PITFALL.EXE folder. MP3 and WAV are supported.
; A track with no file plays silence for the length of the original track.
;
; Default layout: rip the audio tracks of your game CD to a "music" folder
; named Track02.mp3 ... Track24.mp3 (track 1 is the data track).

[options]
; 1 = write PITMM.LOG in the game folder (troubleshooting)
log=0
; 1 = do not emulate: use the physical CD drive with the original disc
realcd=0

[tracks]
2=music\Track02.mp3
3=music\Track03.mp3
4=music\Track04.mp3
5=music\Track05.mp3
6=music\Track06.mp3
7=music\Track07.mp3
8=music\Track08.mp3
9=music\Track09.mp3
10=music\Track10.mp3
11=music\Track11.mp3
12=music\Track12.mp3
13=music\Track13.mp3
14=music\Track14.mp3
15=music\Track15.mp3
16=music\Track16.mp3
