; PITMUSIC.INI example for the 19-track soundtrack release
; ("01 Mayan Adventure Theme.mp3" ... "19 Track 18.mp3") placed in a "music" folder.
; This soundtrack is not a 1:1 copy of the PC CD (23 audio tracks), so the
; mapping below is by level. Tracks 4, 20 and 21 were jungle/water/cave
; ambience on the CD and have no equivalent here (silence).

[options]
log=0
realcd=0

[tracks]
; 2 = opening cutscene
2=music\01 Mayan Adventure Theme.mp3
; 3 = logo screen
3=music\19 Track 18.mp3
; 5 = Ceiba Jungle (also credits)
5=music\02 Ceiba Jungle.mp3
6=music\13 Ceiba Jungle Bossfight.mp3
7=music\03 Xibalba Falls.mp3
8=music\04 Tazamul Mines.mp3
9=music\05 Lost City of Copan.mp3
10=music\14 Lost City of Copan Bossfight.mp3
11=music\06 Copan Temple.mp3
12=music\07 Lakamul Rainforest.mp3
13=music\08 Yaxchilan Lagoon.mp3
; 14 = Tikal Ruins and Palenque Ruins
14=music\10 Tikal Ruins.mp3
; 15 = Temple of Tikal and Tomb of Palenque
15=music\11 Temple of Tikal.mp3
16=music\09 Runaway Minecar.mp3
; 17 = Jaina Island Falls (PC-only level, no own track in this soundtrack)
17=music\03 Xibalba Falls.mp3
18=music\15 Tikal Ruins Bossfight.mp3
19=music\12 Warrior Spirit.mp3
; 22 = ending scene
22=music\16 Ending Cutsene 1.mp3
; 23 = ending / credits
23=music\17 Ending Cutsene 2 Credits.mp3
